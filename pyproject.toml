[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "industrialguard-ai"
version = "1.0.0"
description = "Agentic AI Manufacturing Quality Control and Defect Prevention System"
requires-python = ">=3.11"

dependencies = [
    # ML
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "shap>=0.44",
    "numpy>=1.26",
    "pandas>=2.2",
    "joblib>=1.3",
    # Backend
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "python-multipart>=0.0.9",
    # RAG / Embeddings
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    # IBM watsonx.ai
    "ibm-watsonx-ai>=1.0",
    # Utilities
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "black>=24.0",
    "ruff>=0.4",
    "mypy>=1.10",
]
notebooks = [
    "jupyter>=1.0",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "plotly>=5.22",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
